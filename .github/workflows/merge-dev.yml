name: Dev Merge - Deploy to TEST

on:
  push:
    branches:
      - dev
      - feat/ocp-prod # Remove this before accepting PR! We desire this only to happen when merging to dev.

concurrency:
  # Cancel in progress for PR open and close
  group: test
  cancel-in-progress: false

jobs:
  get-pr-info:
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.vars.outputs.pr }}
    steps:
      - id: vars
        uses: bcgov-nr/action-get-pr@v0.0.1
      - name: Echo PR number
        run: |
          echo "PR: ${{ steps.vars.outputs.pr }}"

  # TODO - Re-enable this after finishing up work. For now, bypassing test and only caring about prod.

