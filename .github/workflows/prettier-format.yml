name: Prettier Format

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Backend Prettify code
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --check ./backend/src/**/*.{js,ts,json} --ignore-path ./.prettierignore --config ./.prettierrc
          prettier_version: 3.8.3
          only_changed: True
          dry: True

      - name: Frontend Prettify code
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --check ./frontend/src/**/*.{js,ts,jsx,tsx,json,css} --ignore-path ./.prettierignore --config ./.prettierrc
          prettier_version: 3.8.3
          only_changed: True
          dry: True

      - name: Formatting issues found
        if: failure()
        run: echo "::warning::Code formatting check failed. Try running npm run format in the project that caused the error and commit your changes"
