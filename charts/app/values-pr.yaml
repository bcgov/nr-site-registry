# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#-- global variables, can be accessed by sub-charts.
global:
  registry: ghcr.io
  autoscaling: false
  secrets:
    enabled: true
    persist: false
  config:
    seed:
      enabled: false # PR/Dev env always cloned , so seed happens in TEST env
#-- the components of the application, backend.
backend:
  #-- enable or disable backend
  enabled: true
  #-- the deployment strategy, can be "Recreate" or "RollingUpdate"
  deploymentStrategy: Recreate
  pdb:
    enabled: false
  resources:
    limits:
      cpu: 100m
      memory: 250Mi
    requests:
      cpu: 50m
      memory: 150Mi

frontend:
  enabled: true
  deploymentStrategy: Recreate
  pdb:
    enabled: false # enable it in PRODUCTION for having pod disruption budget.

