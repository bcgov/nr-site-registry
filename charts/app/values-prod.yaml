# PROD specific overrides
global:
  config:
    VITE_COMS_API: 'prod-coms-api' # need to update with prod url once known
    VITE_S3_STORAGE_REGION: 'ca-central-1'
    VITE_COMS_BUCKET: 'bucket'
    seed:
      enabled: true

backend:
  pdb:
    enabled: true
    # Trying to force replicaCount to 1 during deployment so we only run the seed data scripts once.

  # Temporarily going for 1 pod max, so that we only run the SEED_DATA import scripts once, instead of twice concurrently.
  replicaCount: 1
  autoscaling:
    #-- enable or disable autoscaling.
    enabled: true
    #-- the minimum number of replicas.
    minReplicas: 1
    #-- the maximum number of replicas.
    maxReplicas: 1
    #-- the target cpu utilization percentage, is from request cpu and NOT LIMIT CPU.
    targetCPUUtilizationPercentage: 80
frontend:
  pdb:
    enabled: true # enable it in PRODUCTION for having pod disruption budget.
  config:
    REACT_APP_BACKEND_API: "https://nr-site-registry-prod-backend.apps.silver.devops.gov.bc.ca"
    REACT_APP_AUTH_AUTHORITY: "https://epd-keycloak-prod.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/"
    REACT_APP_AUTH_CLIENT_ID: "site-web"
    REACT_APP_AUTH_REDIRECT_URI: "https://nr-site-registry-prod-frontend.apps.silver.devops.gov.bc.ca"
    REACT_APP_AUTH_LOGOUT_REDIRECT_URI: "https://logon7.gov.bc.ca/clp-cgi/logoff.cgi?retnow=1&returl=https://epd-keycloak-prod.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/protocol/openid-connect/logout?post_logout_redirect_uri=https://nr-site-registry-prod-frontend.apps.silver.devops.gov.bc.ca/"
    REACT_APP_AUTH_RESPONSE_TYPE: "code"
    REACT_APP_AUTH_SCOPE: "openid profile"
    REACT_APP_AUTH_FILTER_PROTOCOL_CLAIMS: "true"
    REACT_APP_AUTH_LOAD_USER_INFO: "true"
    REACT_APP_AUTH_REVOKE_TOKENS_ON_SIGNOUT: "true"
    REACT_APP_COMS_API : "prod-coms-api"
