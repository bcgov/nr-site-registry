crunchy:
  instances:
    name: db  # Ensure consistency with base values.yaml
    replicas: 2 
    # Attempting to explicitly handle dataVolumeClaimSpec to handle missing pvcs in prod.
    # unsure why this would be necessary, it's not in dev/test. Is there a glitch with the operator? mistake in my code?
    dataVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce  # Explicitly define access mode
      resources:
        requests:
          storage: 600Mi  # Matches your current setting
      storageClassName: netapp-block-standard  # Matches your current setting
      walStorage:
        storage: 350Mi  # Matches your current setting
        storageClassName: netapp-block-standard  # Ensure WAL uses the same storage class
  pgBackRest:
    backupPath: /backups/prod/cluster/version
    s3:
      enabled: true
      retention: 7
      bucket: nrsiteprd
      endpoint: nrs.objectstore.gov.bc.ca
      fullBackupSchedule: 0 0/4 * * *
      incrementalBackupSchedule: 0 1,6,11,17,23 * * *
    pvc:
      enabled: false
  pgmonitor:
    enabled: true