---
networks:
  site-backend:
    driver: bridge

volumes:
  pgdata: {}

name: site-registry-local

services:
  site-database:
    image: postgis/postgis:16-3.4
    networks:
      - site-backend
    container_name: site-database
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
    hostname: site-database
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --port=5432"]
      interval: 3s 
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  site-backend:
    networks:
      - site-backend
    build:
      context: backend/
      dockerfile: ./Dockerfile.local
    container_name: site-backend
    env_file:
      - ./backend/.env
    hostname: site-backend
    depends_on:
      site-database:
        condition: service_healthy
    ports:
      - "4007:4007" # GraphQL API port
      - "127.0.0.1:9229:9229"
    volumes:
      - ./backend/:/app
      - ./backend/node_modules:/app/node_modules
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://127.0.0.1:4007" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    container_name: site-frontend
    build:
      context: frontend/
      dockerfile: ./Dockerfile.local
    env_file:
      - ./frontend/.env
    depends_on:
      site-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://127.0.0.1:3000" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    hostname: site-frontend
    ports:
      - "4000:3000" # Map the frontend port to 4000 to avoid conflict with SRS
      - "35729:35729" # Live reload port
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: "/app"
