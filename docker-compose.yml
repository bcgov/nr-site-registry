---
networks:
  app-tier:
    driver: bridge

volumes:
  pgdata: {}

name: site-registry-local

services:
  site-database:
    image: postgis/postgis:16-3.4
    networks:
      - app-tier
    container_name: site-database
    environment:
      # These must match the backend/.env values
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    hostname: site-database
    ports:
      - "5432:5432"
    expose:
      - 5432
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --port=5432"]
      interval: 3s 
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  site-backend:
    networks:
      - app-tier
    build:
      context: backend/
      dockerfile: ./Dockerfile.local
    container_name: site-backend
    hostname: site-backend
    depends_on:
      site-database:
        condition: service_healthy
    links:
      - site-database
    ports:
      - "4007:4007" # GraphQL API port
      - "9222:9222" # Debugging port
    expose:
      - 4007
    volumes:
      - ./backend/:/app
      - ./backend/node_modules:/app/node_modules
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://127.0.0.1:4007" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    container_name: site-frontend
    entrypoint:
      - "sh"
      - "-c"
      - "npm i && npm run start"
    environment:
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      - BACKEND_URL=site-backend
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://127.0.0.1:3000" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    hostname: site-frontend
    image: node:16.14.0-alpine
    ports:
      - "4000:3000" # Map the frontend port to 4000 to avoid conflict with SRS
      - "35729:35729" # Live reload port
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: "/app"
