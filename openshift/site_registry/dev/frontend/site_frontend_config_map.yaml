apiVersion: v1
kind: ConfigMap
metadata:
  name: site-frontend
  namespace: c6a6e5-dev
  labels:
    app.kubernetes.io/name: site-frontend
data:
  REACT_APP_BACKEND_API: 'https://nr-site-registry-dev-backend.apps.silver.devops.gov.bc.ca'
  REACT_APP_AUTH_AUTHORITY: 'https://epd-keycloak-dev.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/'
  REACT_APP_AUTH_CLIENT_ID: 'site-web'
  REACT_APP_AUTH_REDIRECT_URI: 'https://nr-site-registry-dev-frontend.apps.silver.devops.gov.bc.ca'
  REACT_APP_AUTH_LOGOUT_REDIRECT_URI: 'https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi?retnow=1&https://epd-keycloak-dev.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/protocol/openid-connect/logout?post_logout_redirect_uri=https://nr-site-registry-dev-frontend.apps.silver.devops.gov.bc.ca'
  REACT_APP_AUTH_RESPONSE_TYPE: 'code'
  REACT_APP_AUTH_SCOPE: 'openid profile'
  REACT_APP_AUTH_FILTER_PROTOCOL_CLAIMS: 'true'
  REACT_APP_AUTH_LOAD_USER_INFO: 'true'
  REACT_APP_AUTH_REVOKE_TOKENS_ON_SIGNOUT: 'true'
  REACT_APP_COMS_API: 'https://epd-coms-dev.apps.silver.devops.gov.bc.ca/api/v1/'
  config.js: "// runtime-config.js vars\n  window[\"_env_\"] =  {\n
    \"REACT_APP_BACKEND_API\": \"https://nr-site-registry-dev-backend.apps.silver.devops.gov.bc.ca\",\n
    \"REACT_APP_AUTH_AUTHORITY\": \"https://epd-keycloak-dev.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/\",\n
    \"REACT_APP_AUTH_CLIENT_ID\": \"site-web\",\n
    \"REACT_APP_AUTH_REDIRECT_URI\": \"https://nr-site-registry-dev-frontend.apps.silver.devops.gov.bc.ca\",\n
    \"REACT_APP_AUTH_LOGOUT_REDIRECT_URI\": \"https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi?retnow=1&returl=https://epd-keycloak-dev.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/protocol/openid-connect/logout?post_logout_redirect_uri=https://nr-site-registry-dev-frontend.apps.silver.devops.gov.bc.ca\",\n
    \"REACT_APP_AUTH_RESPONSE_TYPE\": \"code\",\n
    \"REACT_APP_AUTH_SCOPE\": \"openid profile\",\n
    \"REACT_APP_AUTH_FILTER_PROTOCOL_CLAIMS\": \"true\",\n
    \"REACT_APP_AUTH_LOAD_USER_INFO\": \"true\",\n
    \"REACT_APP_COMS_API\": \"https://epd-coms-dev.apps.silver.devops.gov.bc.ca/api/v1/\"\n
    }"
