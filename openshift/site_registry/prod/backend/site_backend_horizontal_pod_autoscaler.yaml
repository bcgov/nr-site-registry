apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: site-backend
  namespace: c6a6e5-prod
  labels:
    app.kubernetes.io/name: site-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: site-backend
  minReplicas: 3
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
